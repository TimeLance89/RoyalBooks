name: Tests
on:
  push:
    branches: [main, 'feature/**']
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: pip install -e '.[test]'
      - name: Test
        run: pytest -q
      - name: Build image
        run: docker build -t royalbooks:test .
