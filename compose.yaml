services:
  royalbooks:
    build: .
    restart: unless-stopped
    ports:
      - "${ROYALBOOKS_PORT:-8094}:8094"
    environment:
      ROYALBOOKS_DB_PATH: /data/royalbooks.sqlite3
    volumes:
      - "${ROYALBOOKS_DATA_PATH:-./data}:/data"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8094/api/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
