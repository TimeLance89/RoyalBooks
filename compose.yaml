services:
  royalbooks:
    build: .
    restart: unless-stopped
    ports:
      - "${ROYALBOOKS_BIND_IP:-127.0.0.1}:${ROYALBOOKS_PORT:-8094}:8094"
    environment:
      ROYALBOOKS_DB_PATH: /data/royalbooks.sqlite3
      ROYALBOOKS_API_TOKEN: ${ROYALBOOKS_API_TOKEN:-}
      ROYALBOOKS_TRUSTED_NETWORKS: ${ROYALBOOKS_TRUSTED_NETWORKS:-}
      GOOGLE_BOOKS_API_KEY: ${GOOGLE_BOOKS_API_KEY:-}
      ROYALBOOKS_PROWLARR_URL: ${ROYALBOOKS_PROWLARR_URL:-}
      ROYALBOOKS_PROWLARR_API_KEY: ${ROYALBOOKS_PROWLARR_API_KEY:-}
      ROYALBOOKS_INDEXERS_PATH: /data/indexers.json
      ROYALBOOKS_DOWNLOADS_ENABLED: ${ROYALBOOKS_DOWNLOADS_ENABLED:-1}
      ROYALBOOKS_STORE_REFRESH_ENABLED: ${ROYALBOOKS_STORE_REFRESH_ENABLED:-1}
      ROYALBOOKS_ENABLE_LEGACY_WORKER: ${ROYALBOOKS_ENABLE_LEGACY_WORKER:-0}
      ROYALBOOKS_LIBRARY_BACKEND: bookorbit
      ROYALBOOKS_BOOKORBIT_URL: ${ROYALBOOKS_BOOKORBIT_URL:-}
      ROYALBOOKS_BOOKORBIT_PUBLIC_URL: ${ROYALBOOKS_BOOKORBIT_PUBLIC_URL:-}
      ROYALBOOKS_BOOKORBIT_INGEST_PATH: ${ROYALBOOKS_BOOKORBIT_INGEST_PATH:+/bookorbit-ingest}
      ROYALBOOKS_BOOKORBIT_LIBRARY_PATH: ${ROYALBOOKS_BOOKORBIT_LIBRARY_PATH:+/bookorbit-library}
      ROYALBOOKS_BOOKORBIT_SECRET_FILE: /run/secrets/bookorbit.env
      ROYALBOOKS_BOOKORBIT_VERIFY_IMPORT: ${ROYALBOOKS_BOOKORBIT_VERIFY_IMPORT:-0}
    volumes:
      - "${ROYALBOOKS_DATA_PATH:-./data}:/data"
      # Dedicated Book Dock, never a normal BookOrbit library.
      - "${ROYALBOOKS_BOOKORBIT_INGEST_PATH:-./data/disabled-bookorbit-ingest}:/bookorbit-ingest"
      - "${ROYALBOOKS_BOOKORBIT_LIBRARY_PATH:-./data/disabled-bookorbit-library}:/bookorbit-library:ro"
      - "${ROYALBOOKS_SECRETS_PATH:-./secrets}:/run/secrets:ro"
    group_add:
      - "${ROYALBOOKS_BOOKORBIT_GID:-1000}"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8094/api/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
